name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build proxhy wheel
        run: uv build --wheel

      - name: Get wheel path
        id: wheel
        run: echo "path=$(ls dist/proxhy-*.whl | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build binaries with uvbox
        run: uvx uvbox wheel --config uvbox.toml ${{ steps.wheel.outputs.path }}

      - name: List build output
        run: ls -la dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: proxhy-wheel
          path: dist/*.whl

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: proxhy-binaries
          path: |
            dist/proxhy-*.tar.gz
            dist/proxhy-*.zip

  wheels:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux x86_64
          - ubuntu-24.04-arm # linux aarch64
          - windows-latest # windows x86_64
          - windows-11-arm # windows aarch64
          - macos-15-intel # macos x86_64
          - macos-latest # macos aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv build --wheel --all-packages
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  publish-index:
    needs: wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: wheels

      - name: Generate PEP 503 index
        run: uvx simple503 --copy --sort wheels pages/simple

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4

  release:
    needs: [build, wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get version without v prefix
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            proxhy-*
            *.whl
