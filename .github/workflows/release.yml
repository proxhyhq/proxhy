name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # llvmlite doesn't publish macOS x86_64 wheels
          # - os: macos-15-intel
          #   target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --no-editable

      - name: Build with PyInstaller
        run: uv run pyinstaller --onefile --bootloader-ignore-signals --collect-submodules proxhy --collect-all numba --add-data assets:assets --name proxhy launcher.py

      - name: Archive build output
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../proxhy-${{ matrix.target }}.zip proxhy
          else
            tar -czf ../proxhy-${{ matrix.target }}.tar.gz proxhy
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxhy-${{ matrix.target }}
          path: |
            proxhy-*.tar.gz
            proxhy-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Get version without v prefix
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: artifacts/*
