name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # uvbox can cross compile
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build proxhy wheel
        run: uv build --wheel

      - name: Get wheel path
        id: wheel
        run: echo "path=$(ls dist/proxhy-*.whl | head -1)" >> $GITHUB_OUTPUT

      - name: Build binaries with uvbox
        run: uvx uvbox wheel --config uvbox.toml ${{ steps.wheel.outputs.path }}

      - name: List build output
        run: ls -la dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: proxhy-wheel
          path: dist/*.whl

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: proxhy-binaries
          path: |
            dist/proxhy-*.tar.gz
            dist/proxhy-*.zip

  # ── Publish wheel to GitHub Pages index ─────────────────────────
  publish-index:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel
        run: uv build --wheel
      - name: Generate simple index
        run: |
          mkdir -p pages/simple/proxhy
          cp dist/proxhy-*.whl pages/simple/proxhy/
          echo "<html><body>" > pages/simple/proxhy/index.html
          for f in pages/simple/proxhy/*.whl; do
            name=$(basename "$f")
            echo "<a href=\"$name\">$name</a><br>" >> pages/simple/proxhy/index.html
          done
          echo "</body></html>" >> pages/simple/proxhy/index.html
          echo "<html><body><a href=\"proxhy/\">proxhy</a></body></html>" \
            > pages/simple/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4

  # ── Create GitHub Release ────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get version without v prefix
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            proxhy-*
            *.whl
