name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux x86_64
          - ubuntu-24.04-arm # linux aarch64
          - windows-latest # windows x86_64
          - windows-11-arm # windows aarch64
          - macos-15-intel # macos x86_64
          - macos-latest # macos aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --no-editable

      - name: Build with PyInstaller
        run: uv run pyinstaller --collect-submodules proxhy --collect-all numba --add-data assets:assets --name proxhy launcher.py

      - name: Archive build output
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../proxhy-${{ matrix.os }}.zip proxhy
          else
            tar -czf ../proxhy-${{ matrix.os }}.tar.gz proxhy
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxhy-${{ matrix.os }}
          path: |
            proxhy-*.tar.gz
            proxhy-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Get version without v prefix
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: artifacts/*
