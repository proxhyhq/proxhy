[package]
name = "_petty"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib = Python extension; rlib = needed so the stub_gen bin can link it
crate-type = ["cdylib", "rlib"]

[[bin]]
doc = false
name = "stub_gen"
path = "src/stub_gen.rs"

[dependencies]
flate2 = "1"
pyo3 = { version = "0.29", features = ["abi3-py314"] }
pyo3-stub-gen = { version = "0.23" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
